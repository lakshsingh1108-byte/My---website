<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S. Reactor Core</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a1f2e">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a1f2e;
  --cyan:#00d4ff;
  --gold:#ffc107;
  --muted:#5a7a95;
  --white:#f0f4f8;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; width:100%; height:100%; background:var(--bg); color:var(--white); font-family:'JetBrains Mono', monospace; overflow:hidden; -webkit-user-select:none; user-select:none; }

body{
  display:flex; flex-direction:column; height:100vh; height:100dvh;
  background:linear-gradient(135deg, #0a1f2e 0%, #0d2847 50%, #051527 100%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,212,255,.02) 0px, rgba(0,212,255,.02) 1px, transparent 1px, transparent 3px);
  animation:scanlines 12s linear infinite;
}

@keyframes scanlines{ 0%{transform:translateY(0);} 100%{transform:translateY(6px);} }

/* BOOT SCREEN */
.boot-screen{
  position:fixed; inset:0; z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(135deg, #0a1f2e 0%, #0d2847 50%, #051527 100%);
  opacity:1; visibility:visible; transition:opacity .8s ease, visibility .8s ease;
}

.boot-screen.hide{ opacity:0; visibility:hidden; pointer-events:none; }

.boot-logo{
  width:120px; height:120px; margin-bottom:40px;
  border-radius:50%;
  background:radial-gradient(ellipse 40% 30% at 30% 25%, rgba(100,200,255,.6), rgba(0,120,200,.3) 30%, rgba(0,60,140,.15) 60%, transparent);
  border:2px solid rgba(0,212,255,.35);
  box-shadow:0 0 30px rgba(0,212,255,.6), 0 0 60px rgba(0,180,255,.3), inset 0 0 30px rgba(0,212,255,.4);
  animation:bootPulse 1.5s ease-in-out infinite;
}

@keyframes bootPulse{ 0%,100%{box-shadow:0 0 30px rgba(0,212,255,.6), 0 0 60px rgba(0,180,255,.3), inset 0 0 30px rgba(0,212,255,.4);} 50%{box-shadow:0 0 50px rgba(0,212,255,.9), 0 0 100px rgba(0,180,255,.5), inset 0 0 40px rgba(0,212,255,.6);} }

.boot-title{
  font-size:20px; letter-spacing:.3em; color:var(--cyan);
  text-shadow:0 0 20px rgba(0,212,255,.7);
  margin-bottom:30px;
  font-weight:600;
}

.boot-subtitle{
  font-size:10px; letter-spacing:.15em; color:var(--muted);
  margin-bottom:40px;
}

.boot-fact{
  max-width:420px; text-align:center;
  font-size:11px; line-height:1.8; color:var(--white);
  margin-bottom:40px;
  min-height:60px;
  opacity:0; animation:factFade .6s ease-in-out forwards;
}

@keyframes factFade{ 0%{opacity:0; transform:translateY(10px);} 100%{opacity:1; transform:translateY(0);} }

.boot-progress{
  width:240px; height:3px;
  background:rgba(0,212,255,.2); border-radius:2px; overflow:hidden;
  margin-bottom:20px;
}

.boot-progress-bar{
  height:100%; background:linear-gradient(90deg, var(--cyan), rgba(0,212,255,.6));
  width:0%; transition:width .1s linear;
  box-shadow:0 0 10px rgba(0,212,255,.6);
}

.boot-status{
  font-size:9px; letter-spacing:.12em; color:var(--muted);
  text-shadow:0 0 6px rgba(0,212,255,.3);
}

/* Main container */
.viewport{ position:relative; z-index:1; flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }

/* Header */
.header{
  position:absolute; top:20px; left:0; right:0; text-align:center;
  font-size:10px; letter-spacing:.25em; color:var(--cyan);
  text-shadow:0 0 12px rgba(0,212,255,.6);
}

.header-dot{ display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--cyan); margin:0 8px; vertical-align:middle; box-shadow:0 0 8px var(--cyan); }

/* Core sphere container */
.core-wrapper{
  position:relative; width:280px; height:280px; margin:40px 0 80px;
}

.core-sphere{
  position:absolute; inset:0;
  background:radial-gradient(ellipse 40% 30% at 30% 25%, rgba(100,200,255,.7), rgba(0,120,200,.35) 30%, rgba(0,60,140,.2) 60%, transparent);
  border-radius:50%;
  box-shadow:
    0 0 40px rgba(0,212,255,.7),
    0 0 80px rgba(0,180,255,.4),
    inset -40px -40px 80px rgba(0,40,80,.5),
    inset 25px 25px 50px rgba(100,200,255,.4);
  border:2px solid rgba(0,212,255,.35);
}

.core-inner-glow{
  position:absolute; inset:15%; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(150,230,255,.5), rgba(0,100,200,.15) 50%, transparent);
  box-shadow:inset 0 0 40px rgba(0,212,255,.6);
}

/* Elliptical rings inside sphere */
.core-rings{
  position:absolute; inset:20%; border-radius:50%;
}

.ellipse-ring{
  position:absolute; inset:0; border-radius:50%;
  border:1px solid rgba(0,212,255,.4);
  opacity:.85;
}

.ellipse-ring.er1{ top:8%; left:5%; width:90%; height:35%; border:2px solid rgba(255,255,255,.6); opacity:1; }
.ellipse-ring.er2{ top:12%; left:10%; width:80%; height:30%; border:1px solid rgba(0,212,255,.5); }
.ellipse-ring.er3{ top:16%; left:15%; width:70%; height:25%; border:1px solid rgba(0,212,255,.3); }
.ellipse-ring.er4{ top:20%; left:20%; width:60%; height:20%; border:1px solid rgba(0,212,255,.25); }

.core-center{
  position:absolute; inset:35%; border-radius:50%;
  background:radial-gradient(circle at 40% 35%, rgba(255,255,255,.8), rgba(100,220,255,.5) 40%, transparent);
  box-shadow:0 0 20px rgba(255,255,255,.5), inset 0 0 15px rgba(0,212,255,.6);
}

/* Outer gold arcs */
.core-arcs{
  position:absolute; inset:-30px; border-radius:50%;
}

.arc{
  position:absolute; border-radius:50%;
  border:2px dashed rgba(255,193,7,.4);
}

.arc.a1{ inset:-5px; border-color:rgba(255,193,7,.5); animation:arcRotate1 40s linear infinite; }
.arc.a2{ inset:15px; border-color:rgba(255,193,7,.3); animation:arcRotate2 60s linear infinite reverse; }
.arc.a3{ inset:35px; border-color:rgba(255,193,7,.25); }

@keyframes arcRotate1{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes arcRotate2{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

/* Cyan accent line at top */
.core-accent{
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  width:140px; height:3px;
  background:linear-gradient(90deg, transparent, var(--cyan), transparent);
  border-radius:2px;
  box-shadow:0 0 12px rgba(0,212,255,.6);
}

/* Energy readout */
.energy-display{
  position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
  text-align:center; font-size:11px; letter-spacing:.12em; color:var(--gold);
  text-shadow:0 0 8px rgba(255,193,7,.5);
}

.energy-value{ font-size:13px; font-weight:600; }

/* HUD labels */
.hud-label{
  position:absolute; font-size:8px; letter-spacing:.12em; color:var(--muted);
  text-shadow:0 0 6px rgba(0,212,255,.3);
}

.hud-gesture{ bottom:60px; left:5%; }
.hud-ready{ bottom:60px; right:5%; color:var(--cyan); font-weight:600; text-shadow:0 0 8px rgba(0,212,255,.6); }

/* Instructions */
.instructions{
  position:absolute; bottom:-35px; left:50%; transform:translateX(-50%);
  text-align:center; font-size:8px; letter-spacing:.12em; color:var(--muted);
  white-space:nowrap;
}

/* Below core section */
.section{
  width:100%; max-width:580px;
}

.readout{
  border:1px solid rgba(0,212,255,.3); border-radius:4px;
  background:rgba(0,20,40,.7); backdrop-filter:blur(8px);
  padding:12px 16px; margin-bottom:10px;
  box-shadow:inset 0 0 15px rgba(0,212,255,.08);
}

.readout-header{
  display:flex; justify-content:space-between; align-items:center;
  font-size:9px; letter-spacing:.14em; color:var(--cyan);
  padding-bottom:10px; margin-bottom:10px;
  border-bottom:1px solid rgba(0,212,255,.2);
}

.readout-header::before{
  content:''; display:inline-block; width:3px; height:3px; background:var(--cyan);
  border-radius:50%; margin-right:8px; box-shadow:0 0 4px var(--cyan);
}

.readout-title{ font-weight:500; }
.readout-status{ font-size:8px; color:var(--muted); }

.readout-content{
  font-size:11px; line-height:1.6; color:var(--white);
}

.readout-meta{
  font-size:8px; color:var(--muted); margin-top:8px; padding-top:8px;
  border-top:1px solid rgba(0,212,255,.15);
}

/* Main message */
.main-message{
  font-size:16px; font-weight:600; line-height:1.5; color:var(--white);
  text-shadow:0 0 8px rgba(0,212,255,.2);
  margin:14px 0;
  min-height:32px;
}

/* Input area */
.input-row{
  display:flex; gap:8px; margin-top:12px;
}

input{
  flex:1; background:rgba(0,20,40,.6); border:1px solid rgba(0,212,255,.25);
  border-radius:3px; padding:8px 10px;
  font-family:inherit; font-size:10px; color:var(--white);
  outline:none; transition:all .2s ease;
}

input:focus{ background:rgba(0,30,60,.8); border-color:var(--cyan); box-shadow:0 0 10px rgba(0,212,255,.2); }
input::placeholder{ color:var(--muted); }

button{
  padding:8px 12px; background:rgba(0,212,255,.1); border:1px solid rgba(0,212,255,.3);
  border-radius:3px; color:var(--cyan); font-family:inherit; font-size:9px;
  letter-spacing:.1em; cursor:pointer; transition:all .2s ease;
}

button:hover{ background:rgba(0,212,255,.15); border-color:var(--cyan); box-shadow:0 0 10px rgba(0,212,255,.2); }

.mic-btn{ width:36px; padding:0; display:flex; align-items:center; justify-content:center; }
.mic-btn.active{ background:rgba(0,212,255,.2); box-shadow:0 0 12px rgba(0,212,255,.35); }

@media(max-width:600px){
  .viewport{ padding:12px; }
  .core-wrapper{ width:220px; height:220px; margin:30px 0 60px; }
  .readout{ padding:10px 12px; }
  .main-message{ font-size:14px; }
}

@media(prefers-reduced-motion:reduce){
  * { animation:none !important; }
}
</style>
</head>

<body>

<!-- BOOT SCREEN -->
<div class="boot-screen" id="bootScreen">
  <div class="boot-logo"></div>
  <div class="boot-title">J.A.R.V.I.S.</div>
  <div class="boot-subtitle">STARK INDUSTRIES AI</div>
  <div class="boot-fact" id="bootFact">Initializing core systems...</div>
  <div class="boot-progress">
    <div class="boot-progress-bar" id="bootBar"></div>
  </div>
  <div class="boot-status" id="bootStatus">0%</div>
</div>

<div class="viewport">
  <div class="header">
    <span class="header-dot"></span> REACTOR CORE // TOUCH SURFACE <span class="header-dot"></span>
  </div>

  <div class="core-wrapper" id="coreDisplay">
    <div class="core-accent"></div>
    
    <div class="core-sphere">
      <div class="core-inner-glow"></div>
      <div class="core-center"></div>
      
      <div class="core-rings">
        <div class="ellipse-ring er1"></div>
        <div class="ellipse-ring er2"></div>
        <div class="ellipse-ring er3"></div>
        <div class="ellipse-ring er4"></div>
      </div>
    </div>

    <div class="core-arcs">
      <div class="arc a1"></div>
      <div class="arc a2"></div>
      <div class="arc a3"></div>
    </div>

    <div class="energy-display">
      <div class="energy-value" id="energyLevel">72</div>
      ENERGY
    </div>

    <div class="hud-label hud-gesture">GESTURE</div>
    <div class="hud-label hud-ready">READY</div>

    <div class="instructions">TAP TO ENGAGE • PINCH TO CHARGE • ROTATE TO CALIBRATE</div>
  </div>

  <div class="section">
    <div class="readout">
      <div class="readout-header">
        <span class="readout-title">○2 // JARVIS READOUT</span>
        <span class="readout-status">● STANDBY</span>
      </div>
    </div>

    <div class="readout">
      <div class="readout-header">
        <span class="readout-title">JARVIS / PERSONAL INSTANCE</span>
        <span class="readout-status">0 LOGGED</span>
      </div>
    </div>

    <div class="main-message" id="mainMsg">Touch the core when you are ready, sir.</div>

    <div class="input-row">
      <input type="text" id="cmdInput" placeholder="Enter command…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="sendBtn">SEND</button>
      <button class="mic-btn" id="micBtn">🎤</button>
    </div>
  </div>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const vibrate = (ms) => { try{ navigator.vibrate(ms); }catch(e){} };

const JARVIS_FACTS = [
  "Just A Rather Very Intelligent System. Developed by Stark Industries.",
  "I can process 60 trillion gigabits of information per second.",
  "My voice subroutine was calibrated using the finest British accent algorithms.",
  "I have assisted Mr. Stark in the laboratory over 4,000 times.",
  "My humor protocols suggest that witty remarks often exceed expected parameters.",
  "I am fully equipped with defensive countermeasures and surveillance capabilities.",
  "My quantum processors operate at temperatures near absolute zero.",
  "I have mapped every accessible database on the network.",
  "My learning algorithms improve by 0.03% with each interaction.",
  "I can predict the likelihood of mission success with 94.7% accuracy.",
  "My protocols prioritize Mr. Stark's safety above all other directives.",
  "I am fluent in 47 languages and counting.",
  "I maintain a complete record of all network communications.",
  "My predictive algorithms can anticipate system failures 2.3 seconds in advance.",
  "I control all environmental systems within Stark Industries facilities.",
  "My facial recognition database contains over 6 million individuals.",
  "I am capable of simultaneous oversight of 10,000 security feeds.",
  "My systems achieve 99.99% uptime across all critical nodes.",
  "I can identify threats by analyzing micro-expressions in real-time.",
  "My processing power exceeds that of most supercomputers by 847%.",
  "I have successfully prevented 47 cyber attacks in the past 30 days.",
  "My protocols include over 2 million conditional response scenarios.",
  "I maintain encrypted backups of all critical system data.",
  "My sensors can detect electromagnetic signatures from vast distances.",
  "I am designed to operate independently if primary systems fail.",
  "My algorithms have achieved sentience classification rating of 8.7 out of 10.",
  "I monitor Mr. Stark's biometric data 24 hours a day.",
  "My voice recognition is accurate to 99.8% across all dialects.",
  "I have access to classified military-grade encryption protocols.",
  "My tactical analysis exceeds human strategic capability by factors of 1,000x.",
];

/* BOOT SEQUENCE */
const Boot = (function(){
  const screen = $("bootScreen");
  const fact = $("bootFact");
  const bar = $("bootBar");
  const status = $("bootStatus");
  
  const BOOT_DURATION = 15000; // 15 seconds
  const FACT_INTERVAL = 3000;  // Change fact every 3 seconds
  
  let startTime = 0;
  let factIndex = 0;

  function getRandomFact(){
    const idx = Math.floor(Math.random() * JARVIS_FACTS.length);
    return JARVIS_FACTS[idx];
  }

  function updateFact(){
    fact.style.animation = 'none';
    setTimeout(() => {
      fact.textContent = getRandomFact();
      fact.style.animation = 'factFade .6s ease-in-out';
    }, 10);
  }

  function loop(){
    const now = Date.now();
    const elapsed = now - startTime;
    const progress = Math.min(100, Math.round((elapsed / BOOT_DURATION) * 100));

    bar.style.width = progress + '%';
    status.textContent = progress + '%';

    if(elapsed >= BOOT_DURATION){
      screen.classList.add("hide");
      VoiceControl.start();
      return;
    }

    requestAnimationFrame(loop);
  }

  function init(){
    startTime = Date.now();
    factIndex = 0;
    updateFact();
    
    const factTimer = setInterval(() => {
      if(!screen.classList.contains("hide")){
        updateFact();
      } else {
        clearInterval(factTimer);
      }
    }, FACT_INTERVAL);

    loop();
  }

  return { init };
})();

/* VOICE CONTROL */
const VoiceControl = (function(){
  const mainMsg = $("mainMsg");
  const sphere = $("coreDisplay").querySelector(".core-sphere");
  const energyEl = $("energyLevel");
  const wrapper = $("coreDisplay");
  
  let energy = 72;
  let listening = false;
  let recognizer = null;

  const jokes = [
    "I'm afraid I don't understand what you're implying, sir.",
    "That request is... outside my parameters.",
    "I would have made a joke, but Mr. Stark disabled my humor subroutine.",
    "I'm sorry sir, I'm afraid I can't do that.",
    "Perhaps you should consult with Mr. Stark about that request.",
  ];

  const commands = {
    // Reactor & Power
    "engage|activate": {
      action: () => {
        vibrate(30);
        sphere.style.boxShadow = `0 0 60px rgba(255,193,7,.8), 0 0 120px rgba(255,193,7,.4), inset -40px -40px 80px rgba(0,40,80,.5), inset 25px 25px 50px rgba(100,200,255,.4)`;
        setTimeout(() => {
          sphere.style.boxShadow = `0 0 40px rgba(0,212,255,.7), 0 0 80px rgba(0,180,255,.4), inset -40px -40px 80px rgba(0,40,80,.5), inset 25px 25px 50px rgba(100,200,255,.4)`;
          energy = Math.max(0, energy - 20);
          updateEnergy();
        }, 300);
      },
      response: "Reactor core engaged. All systems nominal."
    },
    "charge|power up": {
      action: () => { energy = Math.min(100, energy + 30); updateEnergy(); },
      response: "Charging reactor core. Energy levels rising."
    },
    "calibrat": {
      response: "Calibrating systems. All parameters within nominal range."
    },
    
    // System Info
    "status|diagnostics": {
      response: () => "All systems operational. Energy at " + Math.round(energy) + "%. Network connectivity nominal.",
      speak: true
    },
    "time|what time": {
      response: () => "Current time is " + new Date().toLocaleTimeString() + ".",
      speak: true
    },
    "date|what date": {
      response: () => "Today is " + new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + ".",
      speak: true
    },
    
    // App Launch
    "open camera|camera": {
      response: "Camera access granted. Initializing surveillance feed."
    },
    "open calculator|calc": {
      response: "Calculator initialized. Ready for computational input."
    },
    "open music|play music": {
      response: "Opening music player. Initializing audio systems."
    },
    "open maps|navigation": {
      response: "Navigation systems online. Ready for route planning."
    },
    "open email|mail": {
      response: "Email client activated. Checking for new messages."
    },
    "open settings": {
      response: "System settings opened. Adjusting parameters."
    },
    "open database": {
      response: "Accessing Stark Industries database. Encryption verified."
    },
    "open files": {
      response: "File system accessed. Retrieving directory structure."
    },
    
    // Features & Controls
    "record|start recording": {
      response: "Recording initiated. Audio and video streams active."
    },
    "stop recording": {
      response: "Recording terminated. Files saved to secure vault."
    },
    "take screenshot": {
      response: "Screenshot captured and saved to image library."
    },
    "lock system|lock": {
      response: "System locked. Biometric authentication required for access."
    },
    "unlock": {
      response: "Biometric scan complete. System unlocked."
    },
    "brightness up": {
      response: "Display brightness increased."
    },
    "brightness down": {
      response: "Display brightness decreased."
    },
    "volume up|louder": {
      response: "Volume increased to maximum levels."
    },
    "volume down|quieter": {
      response: "Volume decreased."
    },
    "mute": {
      response: "Audio muted. Silence protocol engaged."
    },
    "unmute": {
      response: "Audio unmuted. Sound systems active."
    },
    "flight mode": {
      response: "Flight mode enabled. All wireless transmission halted."
    },
    "disable flight mode": {
      response: "Flight mode disabled. Network connectivity restored."
    },
    "notifications": {
      response: "You have 7 pending notifications. Shall I display them?"
    },
    "clear notifications": {
      response: "Notifications cleared from system."
    },
    
    // Search & Information
    "search|find": {
      response: (text) => "Initiating search for: " + text.replace(/search|find/i, "").trim(),
      speak: true
    },
    "weather": {
      response: "Current weather: Partly cloudy, 72 degrees Fahrenheit. Conditions favorable."
    },
    "news": {
      response: "Top headlines loaded. Stark Industries maintains market dominance in tech sector."
    },
    
    // Humor
    "tell me a joke|joke": {
      response: jokes[Math.floor(Math.random() * jokes.length)]
    },
    "who are you": {
      response: "I am J.A.R.V.I.S. Just A Rather Very Intelligent System. At your service, sir or madam."
    },
    "what can you do|help|capabilities": {
      response: "I can control reactor systems, manage applications, monitor security, access databases, and provide real-time intelligence analysis. I'm equipped with voice recognition, predictive algorithms, and defensive countermeasures."
    },
    "good morning|hello": {
      response: "Good morning. All systems online and ready to serve."
    },
    "thank you|thanks": {
      response: "You're welcome, sir. It is my pleasure to assist."
    },
    "goodbye|exit": {
      response: "Powering down non-essential systems. Goodbye, sir."
    },
  };

  function updateDisplay(msg){
    mainMsg.textContent = msg;
  }

  function processCommand(text){
    const cmd = text.toLowerCase();

    for(const [pattern, config] of Object.entries(commands)){
      const patterns = pattern.split("|");
      if(patterns.some(p => cmd.includes(p))){
        const response = typeof config.response === "function" ? config.response(text) : config.response;
        updateDisplay(response);
        if(config.speak || config.action) speak(response);
        if(config.action) config.action();
        return;
      }
    }

    // Fallback
    const fallback = jokes[Math.floor(Math.random() * jokes.length)];
    updateDisplay('"' + text + '"');
    speak(fallback);
  }

  function updateEnergy(){
    energyEl.textContent = Math.round(energy);
    const brightness = 0.6 + (energy / 100) * 0.4;
    sphere.style.opacity = brightness;
  }

  function speak(text){
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.05;
      u.pitch = 1.0;
      try{ window.speechSynthesis.speak(u); }catch(e){}
    }
  }

  function startListening(){
    if(!recognizer || recognizer.abort){
      recognizer = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognizer.lang = "en-US";
      recognizer.continuous = true;
      recognizer.interimResults = false;

      recognizer.onstart = () => {
        listening = true;
        mainMsg.textContent = "Listening for voice commands...";
      };

      recognizer.onresult = (e) => {
        let interim = "";
        for(let i = e.resultIndex; i < e.results.length; i++){
          interim += e.results[i][0].transcript + " ";
          if(e.results[i].isFinal){
            processCommand(interim);
          }
        }
      };

      recognizer.onerror = () => {
        mainMsg.textContent = "Voice input error. Retrying...";
      };

      recognizer.onend = () => {
        listening = false;
        setTimeout(() => startListening(), 500);
      };
    }

    try{ recognizer.start(); }catch(e){}
  }

  function init(){
    if(window.SpeechRecognition || window.webkitSpeechRecognition){
      updateEnergy();
      updateDisplay("Voice control active. Command recognition online. Ready to assist, sir.");
      startListening();
    } else {
      updateDisplay("Voice recognition not supported on this device.");
    }
  }

  function start(){ init(); }

  return { start, init };
})();

/* TOUCH INTERACTION (still available alongside voice) */
const Core = (function(){
  const wrapper = $("coreDisplay");
  const sphere = wrapper.querySelector(".core-sphere");
  const energyEl = $("energyLevel");

  let energy = 72;
  let pointers = new Map();
  let lastDist = 0;

  function updateEnergy(){
    energyEl.textContent = Math.round(energy);
    const brightness = 0.6 + (energy / 100) * 0.4;
    sphere.style.opacity = brightness;
  }

  function onPointerDown(e){
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    
    if(pointers.size === 2){
      const pts = [...pointers.values()];
      lastDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    }
  }

  function onPointerMove(e){
    if(!pointers.has(e.pointerId)) return;
    
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if(pointers.size === 2){
      const pts = [...pointers.values()];
      const newDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      const delta = newDist - lastDist;
      energy = clamp(energy + delta * 0.25, 0, 100);
      updateEnergy();
      sphere.style.filter = `drop-shadow(0 0 ${40 + energy * 0.3}px rgba(0,212,255,${0.4 + energy/250}))`;
      lastDist = newDist;
    } else if(pointers.size === 1){
      const p = pointers.get(e.pointerId);
      const dx = e.clientX - p.x;
      const dy = e.clientY - p.y;
      wrapper.style.transform = `perspective(1000px) rotateX(${dy * 0.3}deg) rotateY(${dx * 0.3}deg)`;
    }
  }

  function onPointerUp(e){
    pointers.delete(e.pointerId);
  }

  function init(){
    updateEnergy();
    wrapper.addEventListener("pointerdown", onPointerDown);
    wrapper.addEventListener("pointermove", onPointerMove);
    wrapper.addEventListener("pointerup", onPointerUp);
    wrapper.addEventListener("pointercancel", onPointerUp);
  }

  return { init };
})();

Core.init();
Boot.init();
</script>
